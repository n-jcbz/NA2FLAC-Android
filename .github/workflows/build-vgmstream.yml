name: Build vgmstream-cli for Android ARM64

on:
  workflow_dispatch: # manual trigger only

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Clone vgmstream
        run: |
          git clone --depth=1 https://github.com/vgmstream/vgmstream.git

      - name: Build vgmstream-cli
        run: |
          cd vgmstream

          # Toolchain setup
          export ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          export TOOLCHAIN=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=26

          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-$API \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_AUDACIOUS=OFF \
            -DBUILD_WINAMP=OFF \
            -DBUILD_XMPLAY=OFF \
            -DBUILD_VGMSTREAM_PLAYER=OFF \
            -DUSE_MPEG=OFF \
            -DUSE_VORBIS=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_CELT=OFF \
            -DUSE_SPEEX=OFF \
            -DUSE_ATRAC9=OFF \
            -DUSE_G719=OFF \
            -DUSE_MAIATRAC3PLUS=OFF

          cmake --build build --target vgmstream-cli -j$(nproc)

      - name: Find built binaries
        run: |
          echo "=== everything in build/ ==="
          find vgmstream/build -type f | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vgmstream-cli-android-arm64
          path: vgmstream/build/vgmstream-cli
          retention-days: 30
